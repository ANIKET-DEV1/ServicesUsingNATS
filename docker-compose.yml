version: '3.8'
services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - notification-service

  user-service:
    build: ./user-service
    ports:
      - "8001:8001"
    environment:
      - NATS_URL=nats://nats:4222

  notification-service:
    build: ./notification-service
    ports:
      - "8002:8002"
    environment:
      - NATS_URL=nats://nats:4222
